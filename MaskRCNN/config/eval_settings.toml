# Configuration file for evaluation of Mask R-CNN model on coral reef halo segmentation 

# ============================
# Paths
# ============================
[Paths]
dataset_pth = "./MaskRCNN/dataset_path.csv"
model_pth = "./MaskRCNN/model/2026_04_20_1338.pth"                             # Path to model                        # Path to tif raster file
output_dir = "./MaskRCNN/output/"                                            # Save directory for mask/overlayed outputs

# ============================
# Parameters
# ============================
[Settings]
useFold = 4                                         # Which fold to use for test set.
batch_size = 16                                     # Batch size (if using GPU)
use_cuda= true                                      # GPU available?

pin_memory = true
num_workers = 8 
score_threshold=0.8                                 # Masks to keep
mask_threshold=0.5                                  # Define what is a mask pixel
use_overlap=true                                    # If true, add filling tiles at 2x2 intersections
iou_threshold=0.3                                   # IOU threshold for NMS