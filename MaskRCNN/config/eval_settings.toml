# Configuration file for evaluation of Mask R-CNN model on coral reef halo segmentation 

# ============================
# Paths
# ============================
[Paths]
dataset_pth = "./MaskRCNN/balanced.csv"
model_pth = "./MaskRCNN/model/2026_04_27_2152.pth"                              # Path to model                        # Path to tif raster file
output_dir = "./MaskRCNN/output/"                                            # Save directory for mask/overlayed outputs

# ============================
# Parameters
# ============================
[Settings]
useFold = [0,1,2,3,4]                               # Which fold to use for test set. Must be in list format
batch_size = 32                                     # Batch size (if using GPU)
use_cuda= true                                      # GPU available?
keep_logits = false                                  # Save logits?

pin_memory = true
num_workers = 8 
score_threshold=0.5                                 # Masks to keep
mask_threshold=0.1                                 # Define what is a mask pixel
use_overlap=true                                    # If true, add filling tiles at 2x2 intersections
iou_threshold=0.3                                   # IOU threshold for NMS